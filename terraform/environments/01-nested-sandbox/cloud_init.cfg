#cloud-config
hostname: ${hostname}
fqdn: ${hostname}.local
manage_etc_hosts: true

users:
  - name: ${admin_user}
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    groups: [sudo, kvm, libvirt]
    ssh_authorized_keys:
      - ${ssh_public_key}

package_update: true
package_upgrade: true

packages:
  - qemu-kvm
  - libvirt-daemon-system
  - libvirt-clients
  - bridge-utils
  - virtinst
  - cpu-checker
  - iptables
  - curl
  - jq
  - net-tools

write_files:
  - path: /etc/libvirt/libvirtd.conf
    permissions: '0644'
    content: |
      listen_tls = 0
      listen_tcp = 1
      tcp_port = "16509"
      listen_addr = "0.0.0.0"
      auth_tcp = "none"

runcmd:
  - systemctl enable --now libvirtd
  - systemctl restart libvirtd
  - usermod -aG libvirt,kvm ${admin_user}
  - virsh net-autostart default || true
  - virsh net-start default || true
  - kvm-ok || true

