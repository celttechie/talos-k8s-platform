#cloud-config
hostname: ${hostname}
fqdn: ${hostname}.local
manage_etc_hosts: true

users:
  - name: ${admin_user}
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    groups: [sudo, kvm, libvirt]
    ssh_authorized_keys:
      - ${ssh_public_key}

package_update: true
package_upgrade: true

packages:
  - qemu-kvm
  - libvirt-daemon-system
  - libvirt-clients
  - bridge-utils
  - virtinst
  - cpu-checker
  - iptables
  - curl
  - jq
  - net-tools

write_files:
  - path: /etc/libvirt/libvirtd.conf
    permissions: '0644'
    content: |
      listen_tls = 0
      listen_tcp = 1
      tcp_port = "16509"
      listen_addr = "0.0.0.0"
      auth_tcp = "none"
  - path: /etc/sysctl.d/99-ip-forward.conf
    permissions: '0644'
    content: |
      net.ipv4.ip_forward = 1

runcmd:
  - sysctl --system
  - systemctl enable --now libvirtd
  - systemctl restart libvirtd
  - usermod -aG libvirt,kvm ${admin_user}
  - virsh net-autostart default || true
  - virsh net-start default || true
  - mkdir -p /var/lib/libvirt/images
  - virsh pool-define-as default dir --target /var/lib/libvirt/images || true
  - virsh pool-build default || true
  - virsh pool-start default || true
  - virsh pool-autostart default || true
  - iptables -I FORWARD 1 -d 192.168.122.0/24 -j ACCEPT || true
  - iptables -I FORWARD 1 -s 192.168.122.0/24 -j ACCEPT || true
  - kvm-ok || true
