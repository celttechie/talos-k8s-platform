#cloud-config
hostname: ${hostname}
fqdn: ${hostname}.local
manage_etc_hosts: true

users:
  - name: ${admin_user}
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    groups: [sudo, kvm, libvirt]
    ssh_authorized_keys:
      - ${ssh_public_key}

package_update: true
package_upgrade: true

packages:
  - qemu-kvm
  - libvirt-daemon-system
  - libvirt-clients
  - bridge-utils
  - virtinst
  - cpu-checker
  - iptables
  - curl
  - jq
  - net-tools

write_files:
  - path: /etc/libvirt/libvirtd.conf
    permissions: '0644'
    content: |
      listen_tls = 0
      listen_tcp = 1
      tcp_port = "16509"
      listen_addr = "0.0.0.0"
      auth_tcp = "none"
  - path: /etc/libvirt/qemu.conf
    permissions: '0644'
    content: |
      security_driver = "none"
  - path: /etc/sysctl.d/99-ip-forward.conf
    permissions: '0644'
    content: |
      net.ipv4.ip_forward = 1
  - path: /etc/netplan/60-bridge.yaml
    permissions: '0600'
    content: |
      network:
        version: 2
        renderer: networkd
        ethernets:
          ens3:
            dhcp4: false
            dhcp6: false
        bridges:
          br0:
            interfaces: [ens3]
            dhcp4: true
            dhcp6: false
  - path: /tmp/libvirt-bridge-default.xml
    permissions: '0644'
    content: |
      <network>
        <name>default</name>
        <forward mode="bridge"/>
        <bridge name="br0"/>
      </network>

runcmd:
  - sysctl --system
  - fallocate -l 8G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=8192
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - rm -f /etc/netplan/50-cloud-init.yaml
  - netplan apply
  - systemctl enable --now libvirtd
  - systemctl restart libvirtd
  - usermod -aG libvirt,kvm ${admin_user}
  - virsh net-destroy default || true
  - virsh net-undefine default || true
  - virsh net-define /tmp/libvirt-bridge-default.xml || true
  - virsh net-start default || true
  - virsh net-autostart default || true
  - mkdir -p /var/lib/libvirt/images
  - virsh pool-define-as default dir --target /var/lib/libvirt/images || true
  - virsh pool-build default || true
  - virsh pool-start default || true
  - virsh pool-autostart default || true
  - iptables -I FORWARD 1 -j ACCEPT || true
  - kvm-ok || true
