# External Secrets Operator (ESO) Configuration
installCRDs: true

replicaCount: 1

serviceAccount:
  create: true
  name: external-secrets

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

webhook:
  replicaCount: 1

certController:
  replicaCount: 1

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi
