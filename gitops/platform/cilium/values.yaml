# Cilium CNI eBPF Configuration for Talos Linux
ipam:
  mode: kubernetes

kubeProxyReplacement: true
k8sServiceHost: 127.0.0.1
k8sServicePort: 7445

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

# Layer 2 IP Announcements for LoadBalancer Services
l2announcements:
  enabled: true

# Hubble Observability & Flow Visualizer
hubble:
  enabled: true
  metrics:
    enabled:
      - dns:query;ignoreAAAA
      - drop
      - tcp
      - flow
      - port-distribution
      - icmp
      - http
    serviceMonitor:
      enabled: false
  relay:
    enabled: true
  ui:
    enabled: true
    replicas: 1
    service:
      type: ClusterIP
      port: 80

# Prometheus Metric Scrapers
prometheus:
  enabled: true
  serviceMonitor:
    enabled: false

operator:
  replicas: 1
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: false
