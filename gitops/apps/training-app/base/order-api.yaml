apiVersion: v1
kind: Service
metadata:
  name: order-api
  namespace: training
  labels:
    app: order-api
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: order-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
  namespace: training
  labels:
    app: order-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-api
  template:
    metadata:
      labels:
        app: order-api
    spec:
      containers:
        - name: order-api
          image: python:3.11-alpine
          command:
            - /bin/sh
            - -c
            - |
              cat << 'EOF' > server.py
              import http.server
              import socketserver
              import json
              import os

              PORT = int(os.environ.get("PORT", 8080))

              class Handler(http.server.SimpleHTTPRequestHandler):
                  def do_GET(self):
                      if self.path == '/healthz':
                          self.send_response(200)
                          self.send_header('Content-type', 'application/json')
                          self.end_headers()
                          self.wfile.write(b'{"status":"healthy"}')
                      elif self.path == '/api/orders':
                          self.send_response(200)
                          self.send_header('Content-type', 'application/json')
                          self.end_headers()
                          self.wfile.write(b'{"orders":[{"id":101,"item":"Kubernetes Lab Kit","status":"processing"}]}')
                      else:
                          self.send_response(404)
                          self.end_headers()

              with socketserver.TCPServer(("", PORT), Handler) as httpd:
                  print(f"Serving Order API on port {PORT}")
                  httpd.serve_forever()
              EOF
              python3 server.py
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: REDIS_HOST
              value: "redis-cache.training.svc.cluster.local"
            - name: DB_HOST
              value: "postgres-db.training.svc.cluster.local"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
