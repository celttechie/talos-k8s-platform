apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: training-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/celttechie/talos-k8s-platform.git
    targetRevision: HEAD
    path: gitops/apps/training-app
  destination:
    server: https://kubernetes.default.svc
    namespace: training
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
